[package]
name = "greatgramma-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98"

[package.metadata]
cargo-fuzz = true

[dependencies]
greatgramma-core = { path = "../crates/greatgramma-core" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "normalized_input"
path = "fuzz_targets/normalized_input.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"
