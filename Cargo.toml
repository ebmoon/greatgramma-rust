[workspace]
members = [
    "crates/greatgramma",
    "crates/greatgramma-python",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/ebmoon/greatgramma-rust"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "unwind"
