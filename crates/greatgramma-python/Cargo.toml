[package]
name = "greatgramma-python"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
greatgramma-compile = { path = "../greatgramma-compile" }
greatgramma-core = { path = "../greatgramma-core" }
pyo3 = { version = "=0.29.0", features = ["abi3-py310"] }

[features]
panic-test-hook = []

[lints]
workspace = true
